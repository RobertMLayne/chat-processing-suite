name: lfs-guard
on: [push, pull_request]
jobs:
    lfs-guard:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
          group: validation-${{ github.workflow_ref }}-lfs-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
          cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - run: bash scripts/lfs-guard.sh
